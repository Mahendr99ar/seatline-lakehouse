name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lakehouse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Turn on logical decoding
        run: |
          psql "postgresql://postgres:postgres@localhost/lakehouse_test" -c "ALTER SYSTEM SET wal_level = logical"
          docker restart "$(docker ps -q --filter ancestor=postgres:16)"
          until pg_isready -h localhost -U postgres; do sleep 1; done
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
        env:
          TEST_DSN: postgresql://postgres:postgres@localhost/lakehouse_test
