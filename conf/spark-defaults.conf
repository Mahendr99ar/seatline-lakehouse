# Read by every Spark process in the stack: the streaming job and the batch
# steps Airflow runs. Secrets are not here; see lakehouse/lake.py.

spark.jars.packages  org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.iceberg:iceberg-aws-bundle:1.6.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.postgresql:postgresql:42.7.4
spark.jars.ivy       /opt/ivy

spark.sql.extensions                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.catalog-impl     org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.lake.uri              jdbc:postgresql://catalog-db:5432/catalog
spark.sql.catalog.lake.jdbc.user        iceberg
spark.sql.catalog.lake.warehouse        s3://lake/
spark.sql.catalog.lake.io-impl          org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint      http://minio:9000
spark.sql.catalog.lake.s3.path-style-access  true

spark.sql.session.timeZone      UTC
spark.sql.shuffle.partitions    4
spark.ui.showConsoleProgress    false
